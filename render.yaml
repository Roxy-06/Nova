services:
  - type: web
    name: nova-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: ""
        sync: false
      - key: GEMINI_API_KEY
        value: ""
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: CORS_ORIGINS
        value: "*"
      - key: FAST_PUBLISH_FOR_EVAL
        value: "0"

  - type: web
    name: nova-frontend
    env: node
    rootDir: frontend
    plan: free
    region: oregon
    branch: main
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: "https://nova-backend.onrender.com"
      - key: NODE_VERSION
        value: "20"
