services:
  - type: web
    name: nova-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    branch: main
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        value: ""
        sync: false
      - key: GEMINI_API_KEY
        value: ""
        sync: false
    healthCheckPath: /health
    serviceDetails:
      # Use a 3-minute start timeout to allow initial migrations/backfills.
      startCommand: ""
