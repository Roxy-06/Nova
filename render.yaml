services:
  - type: web
    name: nova-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    branch: main
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        value: ""
        sync: false
      - key: GEMINI_API_KEY
        value: ""
        sync: false
    healthCheckPath: /health
    serviceDetails:
      # Use a 3-minute start timeout to allow initial migrations/backfills.
      startCommand: ""
  - type: web
    name: nova-frontend
    env: node
    branch: main
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""
        sync: false
    healthCheckPath: /
